[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = src
markers =
    rasteriser: needs Inkscape installed. Excluded from CI (`-m "not rasteriser"`); run by hand.

# Keep no `tmp_path` scratch at all: pytest clears every earlier run's directory when the
# session starts, and — because `keep == 0` also suppresses the in-use lock file — its own
# when the session ends. A full run leaves some 294 MB behind under the default retention of
# three sessions, which overruns the 923 MB tmpfs that `/tmp` is on the Raspberry Pi the bot
# runs on; three retained runs filled it outright and turned every rasteriser test red with
# 0-byte PNGs and `database or disk is full`. See the `tests/conftest.py` docstring.
#
# The cost is that a failing test's scratch is cleared too. To inspect one, restore retention
# for that run only: `pytest tests/ -q -o tmp_path_retention_count=3`.
#
# Suppressing the lock file also means two *concurrent* pytest runs by the same user on one
# host would clear each other's scratch. Runs are serial here and one job per runner in CI.
tmp_path_retention_count = 0
