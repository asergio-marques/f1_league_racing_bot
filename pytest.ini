[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = src
markers =
    rasteriser: needs Inkscape installed. Excluded from CI (`-m "not rasteriser"`); run by hand.

# Keep no `tmp_path` scratch between runs: pytest clears every earlier run's directory when
# the session starts, and — because `keep == 0` also suppresses the in-use lock file — its own
# when the session ends. Under the default retention of three sessions, three runs filled the
# 923 MB tmpfs that `/tmp` is on the Raspberry Pi the bot runs on outright, and turned every
# rasteriser test red with 0-byte PNGs and `database or disk is full`. See the
# `tests/conftest.py` docstring.
#
# Suppressing the lock file also means two *concurrent* pytest runs by the same user on one
# host would clear each other's scratch. Runs are serial here and one job per runner in CI.
tmp_path_retention_count = 0

# Keep no scratch *within* a run either, except where a test failed and the scratch is
# evidence. The setting above governs whole sessions and does nothing until one ends, so a
# single run still accumulated every test's `tmp_path` as it went: each test that migrates a
# database copies the ~1.8 MB schema template into its own directory, and at some 7,000 tests
# that reached 817 MB and filled the Pi's tmpfs *mid-run* — the same dishonest mass failure
# the setting above exists to prevent, arriving by a different route (measured 2026-09-16,
# 152 MB against 2.9 MB at the same point of the same subset).
#
# `failed` rather than `none` because a failing test's scratch is the only record of what it
# wrote, and clearing it is what made a red run hard to diagnose before. This is strictly more
# than was kept before: the retention above discarded a failure's scratch along with
# everything else.
tmp_path_retention_policy = failed
