# The type check (issue #228). CI's `python-type-check` job runs it and fails the build on any
# error; run it by hand as `mypy` from the repository root.
#
# It checks `src/`, the bot, and not the tests. `mypy_path = src` with `explicit_package_bases`
# names each module the way the bot imports it — `cogs.season_cog`, never
# `src.cogs.season_cog` — because the bot runs as `python src/bot.py`, with `src/` itself on
# the import path (issue #398 was an import that forgot it).
#
# `warn_unused_ignores` is what keeps the silences from growing back. Before #228 some 440
# `# type: ignore[attr-defined]` hid the bot's services from the check, each one turning the
# read into `Any`, through which nothing a service returned was ever checked. A silence that
# no longer silences anything is now an error in itself.

[mypy]
files = src
mypy_path = src:stubs
explicit_package_bases = True
warn_unused_ignores = True
warn_redundant_casts = True
check_untyped_defs = True

# **The sections below are the part of the bot not yet clean, and the list only shrinks.**
# The check was adopted over a codebase that had never run one, and some 370 errors remained
# once the bot had a declared type — most of them `union-attr`, `arg-type` and `index`: values
# that may be None, and `aiosqlite` rows. Rather than gate on none of them, or pass over whole
# files, each module still carrying errors has switched off only the codes it still trips, and
# every other code is checked in it. A module with no section — any new one — is checked in
# full. Clear a module's errors and delete its section; never add a section, or a code to one,
# to get a change through. `attr-defined` and `name-defined`, the codes that see a read of
# something that is not there, are exempt nowhere. `tests/unit/test_type_check_config.py`
# holds all of this.
