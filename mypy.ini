# The type check (issue #228). CI's `python-type-check` job runs it and fails the build on any
# error; run it by hand as `mypy` from the repository root.
#
# It checks `src/`, the bot, and not the tests. `mypy_path = src` with `explicit_package_bases`
# names each module the way the bot imports it — `leaguebot.core.cogs.season_cog`, never
# `src.leaguebot.core.cogs.season_cog` — because the bot is the installed package `leaguebot`,
# whose root is `src/` (issue #398 was an import that named `src`).
#
# **Nothing is exempt, and nothing may be made so** (decided 2026-09-23). There is no section
# below `[mypy]`: no module excused an error code, no library skipped, and no
# `# type: ignore` anywhere in `src/`. Where the check cannot see something the code knows,
# the code says it — a narrowing with its reason, a helper that raises by name, a declared
# type — rather than switching the check off. A `cast` is allowed where it is true by
# construction, and its docstring says why.
#
# Libraries that ship no types are described in `stubs/`, which `mypy_path` reads: fontTools
# and APScheduler 3, for the part the bot uses and no more. A use a stub does not describe is
# an error — extend the stub. `tests/unit/test_library_stubs.py` holds each stub to the
# installed library with mypy's `stubtest`; lxml is described by the pinned `types-lxml`.
#
# `warn_unused_ignores` keeps a silence from creeping back in unnoticed, and
# `check_untyped_defs` checks a function whether it is annotated or not.
# `tests/unit/test_type_check_config.py` holds all of this.

[mypy]
files = src
mypy_path = src:stubs
explicit_package_bases = True
warn_unused_ignores = True
warn_redundant_casts = True
check_untyped_defs = True
