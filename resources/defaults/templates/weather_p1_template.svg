<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="1200" height="675" viewBox="0 0 1200 675"
     font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">

  <!-- ===================================================================
       Weather forecast template — PHASE 1 (initial chance of rain)
       Field catalogue: image_module_specification.md, "Weather image generation"

       Substitutable nodes are addressed by @id. Text nodes carry their value
       as their sole text content; <image> nodes take an xlink:href.
       Anything without an id is static chrome and must not be touched.

       The country is drawn as its flag and is not written out beside it
       (2026-09-01). Naming it said a second time what the flag already says,
       and it held the circuit name to a quarter of the row it now has to
       itself. `country_name` stays in the catalogue for a league that would
       rather read the name; this file simply declines it, and the flag
       resolves from the round's country either way.

       Mandatory : division_name, phase_description, round_number, race_name,
                   rain_probability
       Optional  : season_number, division_tier, track_name, country_name,
                   track_flag, season_number_group, division_tier_group,
                   race_name_group, track_name_group, country_name_group,
                   track_flag_group
       =================================================================== -->

  <defs>
    <style>
      .eyebrow  { font-size:15px;  fill:#8A94A3; letter-spacing:.18em; font-weight:600 }
      .title    { font-size:34px;  fill:#F2F5F8; font-weight:700; inline-size:860px; max-lines:1 }
      .phase    { font-size:16px;  fill:#8A94A3; letter-spacing:.16em; font-weight:600 }
      .roundlbl { font-size:17px;  fill:#8A94A3; letter-spacing:.20em; font-weight:600 }
      .roundnum { font-size:17px;  fill:#E8113C; letter-spacing:.20em; font-weight:700 }
      .track    { font-size:42px; line-height:1.05; inline-size:1104px; max-lines:2;  fill:#F2F5F8; font-weight:700 }
      .sub      { font-size:19px;  fill:#8A94A3 }
      .statlbl  { font-size:15px;  fill:#8A94A3; letter-spacing:.18em; font-weight:600 }
      .hero     { font-size:132px; fill:#F2F5F8; font-weight:700 }
      .body     { font-size:19px;  fill:#8A94A3 }
      .foot     { font-size:11px;  fill:#5A626E; letter-spacing:.22em; font-weight:600 }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="675" fill="#0B0D10"/>

  <!--  heading band (identical across all six weather templates)  -->
  <!--  Each of the two heading values carries its own group, so that a template
        emptying one does not leave the fixed word beside it standing alone. They
        stand apart rather than run together with a separator between them, a
        separator being chrome that survives the emptying of the fields it
        divides.  -->
  <g id="season_number_group" inkscape:label="season_number_group">
    <text class="eyebrow" x="48" y="36"><tspan>SEASON&#160;</tspan><tspan id="season_number" inkscape:label="season_number">1</tspan></text>
  </g>
  <g id="division_tier_group" inkscape:label="division_tier_group">
    <text class="eyebrow" x="184" y="36"><tspan>TIER&#160;</tspan><tspan id="division_tier" inkscape:label="division_tier">1</tspan></text>
  </g>
  <text id="division_name" inkscape:label="division_name" class="title" x="48" y="76">Division Name</text>
  <text id="phase_description" inkscape:label="phase_description" class="phase" x="1152" y="72" text-anchor="end">Initial chance of rain</text>
  <rect x="0" y="93" width="1200" height="3" fill="#E8113C"/>

  <!--  round block  -->
  <text class="roundlbl" x="48" y="124">
    <tspan>ROUND&#160;</tspan><tspan id="round_number" inkscape:label="round_number" class="roundnum">4</tspan>
  </text>
  <!--  The grand prix takes the headline and the circuit the line under it
        (2026-09-01), as the check-in call composes the same two names. The
        grand prix is the mandatory one of the pair and never leaves, so it
        carries no group; the circuit name is optional and carries one, so a
        round whose track matches no record on the server drops the line
        rather than leaving it blank.  -->
  <text id="race_name" inkscape:label="race_name" class="track" x="48" y="188">Grand Prix Name</text>
  <g id="track_name_group" inkscape:label="track_name_group">
    <text id="track_name" inkscape:label="track_name" class="sub" x="48" y="250" style="line-height:1.1;inline-size:1104px;max-lines:2">Track Name</text>
  </g>

  <!--  content: the rain probability, and nothing else 
       No gauge bar and no tick scale: generation replaces text only, so any
       bar drawn here would stay at a fixed length whatever the figure. -->
  <line x1="48" y1="268" x2="1152" y2="268" stroke="#262B33" stroke-width="1"/>

  <text class="statlbl" x="48" y="322">RAIN PROBABILITY</text>
  <text id="rain_probability" inkscape:label="rain_probability" class="hero" x="48" y="452"
        style="font-variant-numeric:tabular-nums">00.0%</text>

  <line x1="48" y1="492" x2="812" y2="492" stroke="#262B33" stroke-width="1"/>
  <text class="body" x="48" y="530">A session-by-session forecast will follow closer to the round.</text>

  <!-- track image: P1 carries the large slot and no small one, the id being unique.
       The plate is inside the group, so that a round carrying no track leaves no
       empty frame standing where the circuit would be. -->
  <g id="track_flag_group" inkscape:label="track_flag_group">
    <rect x="892" y="326.667" width="260" height="186.667" rx="14" fill="#14171C" stroke="#262B33" stroke-width="1"/>
    <image id="track_flag" inkscape:label="track_flag"
           x="912" y="346.667" width="220" height="146.667" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!--  footer  -->
  <line x1="48" y1="628" x2="1152" y2="628" stroke="#262B33" stroke-width="1"/>
  <text class="foot" x="48" y="654">FORECAST</text>
</svg>
