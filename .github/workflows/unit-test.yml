name: Check Python application

on: [push]

# One floor, read twice: once per module and once for `src/` as a whole. Until #208 it was
# measured against the whole repository including `tests/`, which is ~98% covered by
# construction and hid production code sitting below this number. `.coveragerc` scopes the
# measurement to `src/`; do not raise or lower this without reading that file.
env:
  MIN_COVERAGE_REQUIRED: 75

jobs:
  python-test-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: 3.13

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    # `rasteriser`-marked tests need Inkscape, which is too heavy to install on a hosted
    # runner for what it returns. They are run by hand — see CLAUDE.md, Testing.
    #
    # `COVERAGE_CORE=sysmon` selects the sys.monitoring backend (Python 3.12+; this job is
    # on 3.13). The default C tracer costs enough on a large suite to matter against this
    # job's twenty-minute bound — measured on the Pi at 3% of the suite in ten minutes,
    # against under four minutes for the whole of it under sysmon. `.coveragerc` scopes what
    # is measured; this only changes how.
    #
    # `-rs` prints every skipped test and its reason. The summary line below counts skips but
    # cannot say which, and CLAUDE.md asks that a new skip be justified — which needs its name.
    - name: Github Action for testing the code
      env:
        COVERAGE_CORE: sysmon
      run: coverage run -m pytest tests/ -q -rs -m "not rasteriser" --durations=15 --junitxml=pytest-results.xml

    # Every test's time, kept for Linux so the two runners can be compared test by test
    # with `tools/compare_test_timings.py`. `if: always()` because a failed or slow run is when
    # the timings are wanted most. The times here run under coverage, which slows
    # this job a little; the comparison reads them as they are.
    - name: Keep the test timings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-timings-linux
        path: pytest-results.xml
        retention-days: 30
        if-no-files-found: warn

    - name: Verify no test failed
      run: |
        python -c '
        import sys, xml.etree.ElementTree as ET
        root = ET.parse("pytest-results.xml").getroot()
        suite = root.find("testsuite") if root.tag == "testsuites" else root
        tests = int(suite.get("tests", 0))
        failures = int(suite.get("failures", 0))
        errors = int(suite.get("errors", 0))
        skipped = int(suite.get("skipped", 0))
        print(f"{tests} tests ran: {failures} failed, {errors} errored, {skipped} skipped")
        sys.exit(1 if failures or errors else 0)
        '

    # Reported *and* gated, at the same floor as the whole-repo gate below (#208, reversing
    # "reported, never gated"). One number for the whole repository is something a module
    # with no tests at all can sit inside unnoticed — issue #161 was exactly that — so the
    # floor is applied per module as well. It is one threshold at two grains, not two
    # thresholds: `MIN_COVERAGE_REQUIRED` is written once, above, and read by both steps.
    #
    # This runs *before* the whole-repo gate so the breakdown is present on a failing build,
    # which is when it is most worth reading, and the tool prints the table before it exits
    # non-zero for the same reason.
    - name: Coverage by module
      run: |
        coverage json -q -o coverage.json
        python tools/coverage_by_module.py coverage.json \
          --fail-under "$MIN_COVERAGE_REQUIRED" | tee /tmp/by-module.txt
        {
          echo '### Coverage by module'
          echo '```'
          cat /tmp/by-module.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Github Action to retrieve coverage percentage
      id: total-coverage
      run: |
        coverage json -q -o /dev/stdout | python -c 'import sys, json; perc_cov = json.load(sys.stdin)["totals"]["percent_covered"]; is_covered = perc_cov >= '$MIN_COVERAGE_REQUIRED'; print("Coverage is: ", perc_cov); sys.exit(not is_covered)'

  # The bot is developed on Windows and runs in production on a Raspberry Pi, so a
  # Linux-only check misses anything that turns on the host. This job exists to catch that
  # class of drift; it deliberately does not measure coverage, because the floor is one
  # number and two jobs measuring the same lines would only drift against it.
  python-test-check-windows:
    runs-on: windows-latest
    # Without a bound this job runs to GitHub's six-hour default, and Windows minutes bill
    # at twice Linux's. It has no business taking anywhere near twenty.
    timeout-minutes: 20

    defaults:
      run:
        # The failure gate below is a single-quoted multi-line `python -c` script, which
        # pwsh would not take as written. bash is present on the Windows runners, so the
        # step stays identical to the Linux job rather than forked into a second dialect.
        shell: bash

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: 3.13

    # The suite writes a great many small files — a SQLite database per test, and the
    # rendered output beside it. Defender scans every one of them on a runner that has no
    # untrusted code on it, which costs far more than it returns here.
    - name: Stand Defender down for the run
      shell: pwsh
      continue-on-error: true
      run: Set-MpPreference -DisableRealtimeMonitoring $true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Inkscape is absent here as it is on the Linux runner, so the marker is deselected for
    # the same reason. See CLAUDE.md, Testing. `-rs` as on the Linux job: this runner's fonts
    # differ, so its skips differ too, and the log should say which. `--durations` on both jobs
    # names the slowest tests, so one that creeps up is seen before it costs this job its
    # timeout — which is how issue #252 was found, by a timeout and nothing earlier.
    - name: Github Action for testing the code
      run: pytest tests/ -q -rs -m "not rasteriser" --durations=15 --junitxml=pytest-results.xml

    # Every test's time, kept for Windows so the two runners can be compared test by test
    # with `tools/compare_test_timings.py`. `if: always()` because a failed or slow run is when
    # the timings are wanted most.
    - name: Keep the test timings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-timings-windows
        path: pytest-results.xml
        retention-days: 30
        if-no-files-found: warn

    - name: Verify no test failed
      run: |
        python -c '
        import sys, xml.etree.ElementTree as ET
        root = ET.parse("pytest-results.xml").getroot()
        suite = root.find("testsuite") if root.tag == "testsuites" else root
        tests = int(suite.get("tests", 0))
        failures = int(suite.get("failures", 0))
        errors = int(suite.get("errors", 0))
        skipped = int(suite.get("skipped", 0))
        print(f"{tests} tests ran: {failures} failed, {errors} errored, {skipped} skipped")
        sys.exit(1 if failures or errors else 0)
        '

  # The type check (#228). `mypy` reads `mypy.ini`, which checks the whole of `src/` and excuses
  # nothing — read the head of that file before touching either. One job, on Linux alone: the
  # annotations are the same on every host, so a second runner would only check them twice. It
  # gates on its own and does not wait on the tests.
  python-type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: 3.13

    # The whole of `requirements.txt`, not mypy alone: the bot is typed against the libraries
    # it runs on, and a library missing here would be read as `Any` rather than checked.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check the types
      run: mypy
