name: Check PR labels

# Refuses a pull request not labelled from the issues it tracks. The rule is in
# CONTRIBUTING.md, "Pull requests" (#259); `tools/check_pr_labels.py` applies it. The job's
# name, `pr-label-check`, is what the ruleset on `main` requires, so neither is renamed
# without the other.
#
# `pull_request` rather than `pull_request_target`: the check only reads, so the read-only
# token a fork's PR is given is enough, and nothing from a PR ever runs with write access.
# It runs again whenever the labels, the description (where `Part of #N` lives) or the
# commits change, and labels often arrive one by one just after a PR is opened — several
# events in quick succession, each starting a run.
#
# **Every run is left to finish: there is deliberately no `concurrency` group.** A cancelled
# run leaves a check suite with no check in it, and GitHub's PR page reads each workflow's
# newest suite — so whenever the newest happened to be one that was cancelled, the required
# check sat at "Waiting for status to be reported" although other runs had passed. Cancelling
# the running one did it on #378; queuing, which cancels the ones still waiting and keeps
# whichever joined the queue last rather than whichever was created last, did it again on #406.
# A run takes seconds, and `tools/check_pr_labels.py` reads the PR's current state from the API
# whichever event asked, so letting them all finish costs little and every suite holds a result.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  pr-label-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: 3.13

    - name: Check the labels
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: python tools/check_pr_labels.py "$PR"
